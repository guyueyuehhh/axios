name: Syntax check

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  node-syntax:
    name: Check JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 26.x
          package-manager-cache: false

      - name: Parse source JavaScript files
        shell: bash
        run: |
          set -euo pipefail

          git ls-files \
            '*.js' \
            '*.mjs' \
            '*.cjs' \
            'lib/**/*.js' \
            'scripts/**/*.js' \
            'scripts/**/*.mjs' \
            ':!:docs/**' \
            ':!:dist/**' \
            ':!:examples/**' \
            ':!:sandbox/**' \
            ':!:test/**' \
            ':!:tests/**' \
            | while IFS= read -r file; do
              echo "node --check ${file}"
              node --check "${file}"
            done
